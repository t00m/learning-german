<h2 id="examples">Examples</h2>
<ul>
<li>Ich warte schon lange. :: I have been waiting for a long time.</li>
<li>Wie lange dauert das? :: How long does that take?</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>lange</em> is the adverb of time; <em>lang</em> is the adjective: <em>eine lange Hose</em>.</p>
