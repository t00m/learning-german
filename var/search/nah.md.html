<h2 id="examples">Examples</h2>
<ul>
<li>Die Schule ist ganz nah. :: The school is very close.</li>
<li>Die nächste Haltestelle ist am Marktplatz. :: The nearest stop is on the market square.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>nächste</em> also means <em>next</em>: <em>nächste Woche</em>, next week.</p>
