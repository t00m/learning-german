<h2 id="examples">Examples</h2>
<ul>
<li>Das war doch kein Siebenmeter! Doch, der Schiedsrichter hat recht. :: That was no penalty! Yes it was, the referee is right.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>Doch</em> answers <em>yes</em> to a negative question or sentence. In <em>Frag doch mal!</em> it makes a suggestion softer.</p>
