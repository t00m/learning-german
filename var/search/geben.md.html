<h2 id="examples">Examples</h2>
<ul>
<li>Was gibt es zum Frühstück? :: What is there for breakfast?</li>
<li>Bei Fieber geben Sie ihm den Saft. :: If he has a fever, give him the syrup.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>es gibt</em> plus Akkusativ means <em>there is</em> or <em>there are</em>.</p>
