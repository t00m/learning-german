<h2 id="examples">Examples</h2>
<ul>
<li>Fährst du am Dienstag zum Training? :: Are you driving to training on Tuesday?</li>
<li>Wir sind mit dem Bus gefahren. :: We went by bus.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>sein</em> when you go somewhere; <em>haben</em> when you drive someone or something: <em>Ich habe die Kinder gefahren</em>.</p>
