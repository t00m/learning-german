<h2 id="examples">Examples</h2>
<ul>
<li>Bitte seid leise, das Baby schläft. :: Please be quiet, the baby is sleeping.</li>
<li>Ich mache die Musik sofort leiser. :: I'll turn the music down right away.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>The opposite is <em>laut</em>. <em>leiser machen</em>: to turn down.</p>
