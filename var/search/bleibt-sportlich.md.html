<h2 id="variants">Variants</h2>
<ul>
<li>Bis dahin, bleibt sportlich! :: Until then, stay sporty!</li>
<li>Mit sportlichen Grüßen :: With sporting regards</li>
</ul>
<h2 id="usage">Usage</h2>
<p>A friendly closing in sports clubs, like <em>Viele Grüße</em>. <em>Mit sportlichen Grüßen</em> is the written, slightly more formal version.</p>
