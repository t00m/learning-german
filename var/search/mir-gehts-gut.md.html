<h2 id="variants">Variants</h2>
<ul>
<li>Gut, danke. Und dir? :: Fine, thanks. And you?</li>
<li>Es geht. :: So-so.</li>
<li>Nicht so gut. Ich bin erkältet. :: Not so good. I have a cold.</li>
</ul>
<h2 id="usage">Usage</h2>
<p>The answer to <em>Wie geht's?</em>. <em>mir</em> is Dativ: literally <em>it goes well for me</em>.</p>
