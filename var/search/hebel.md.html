<h2 id="examples">Examples</h2>
<ul>
<li>Öffnen Sie die drei grünen Hebel. :: Open the three green levers.</li>
<li>Den unteren roten Hebel darf man nie öffnen. :: You must never open the lower red lever.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>Also figurative: <em>am längeren Hebel sitzen</em> means to have the upper hand.</p>
