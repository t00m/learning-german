<h2 id="examples">Examples</h2>
<ul>
<li>Er soll um halb zehn da sein. :: He should be there at half past nine.</li>
<li>Am Vormittag nicht, da hat mein Sohn ein Spiel. :: Not in the morning, my son has a match then.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>da sein</em>: to be there, to be present.</p>
