<h2 id="examples">Examples</h2>
<ul>
<li>Bist du fertig? Wir müssen los! :: Are you ready? We have to go!</li>
<li>Ich mache die Präsentation morgen fertig. :: I'll finish the presentation tomorrow.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>fertig sein</em>: to be ready or finished. <em>fertig machen</em>: to finish something.</p>
