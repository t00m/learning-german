<h2 id="examples">Examples</h2>
<ul>
<li>Bitte geben Sie den Zettel bis Dienstag zurück. :: Please return the slip by Tuesday.</li>
<li>Ich muss bis sechs arbeiten. :: I have to work until six.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>Usually without an article: <em>bis Montag</em>, <em>bis acht Uhr</em>. With an article it needs <em>zu</em>: <em>bis zum Ende</em>.</p>
