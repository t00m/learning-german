<h2 id="examples">Examples</h2>
<ul>
<li>Die Lehrerin hat angerufen. :: The teacher called.</li>
<li>Die Kinder spielen im Garten. :: The children are playing in the garden.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>Feminine and all plurals. The Dativ plural is <em>den</em> and the noun gets <em>-n</em>: <em>mit den Kindern</em>.</p>
