<h2 id="examples">Examples</h2>
<ul>
<li>Die Kinder freuen sich. :: The children are happy.</li>
<li>Die Eltern treffen sich am Donnerstag. :: The parents meet on Thursday.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>The reflexive pronoun of <em>er, sie, es, sie</em> (plural) and <em>Sie</em>. The others are <em>mich, dich, uns, euch</em>.</p>
