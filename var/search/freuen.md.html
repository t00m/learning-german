<h2 id="examples">Examples</h2>
<ul>
<li>Unsere Kinder freuen sich. :: Our children will be happy.</li>
<li>Ich freue mich auf das Wochenende. :: I am looking forward to the weekend.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>sich freuen auf</em>: to look forward to. <em>sich freuen über</em>: to be happy about. <em>Das freut mich!</em> I'm glad!</p>
