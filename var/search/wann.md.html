<h2 id="examples">Examples</h2>
<ul>
<li>Wann fängt das Training an? :: When does training start?</li>
<li>Weißt du, wann er anfängt? :: Do you know when it starts?</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>wann</em> asks for a time. For <em>when</em> in a statement, use <em>wenn</em> or <em>als</em>.</p>
