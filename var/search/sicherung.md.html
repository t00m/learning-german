<h2 id="examples">Examples</h2>
<ul>
<li>Schalten Sie die Sicherung auch im Urlaub nicht aus. :: Do not switch off the fuse even on holiday.</li>
<li>Die Sicherung ist rausgeflogen. :: The fuse has tripped.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>rausfliegen</em> is colloquial for a fuse that trips. In IT, <em>die Sicherung</em> (<em>die Datensicherung</em>) is a backup.</p>
