<h2 id="examples">Examples</h2>
<ul>
<li>Alle sind da. Wir können anfangen. :: Everybody is here. We can start.</li>
<li>Hallo, alle zusammen! :: Hello, everybody!</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>alle</em> is plural: <em>Alle sind da</em>. For things, <em>alles</em>: <em>Alles ist gut</em>.</p>
