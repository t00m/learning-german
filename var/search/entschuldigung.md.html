<h2 id="examples">Examples</h2>
<ul>
<li>Muss ich eine Entschuldigung schreiben? :: Do I have to write an excuse note?</li>
</ul>
<h2 id="notes">Notes</h2>
<p>Alone, <em>Entschuldigung!</em> means <em>Excuse me!</em> or <em>Sorry!</em>. At school, <em>eine Entschuldigung</em> is the note that explains why a child was absent.</p>
