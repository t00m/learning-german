<h2 id="examples">Examples</h2>
<ul>
<li>Die Eltern treffen sich am Donnerstag in der Schule. :: The parents meet at school on Thursday.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>Only plural: <em>die Eltern</em>. One parent is <em>der Elternteil</em>, but people usually say <em>Mutter</em> or <em>Vater</em>.</p>
