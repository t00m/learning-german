<h2 id="examples">Examples</h2>
<ul>
<li>Wir müssen um halb acht los. :: We have to leave at half past seven.</li>
<li>Ich muss bis sechs arbeiten. :: I have to work until six.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>nicht müssen</em> means <em>not have to</em>: <em>Du musst nicht kommen</em>, you don't have to come.</p>
