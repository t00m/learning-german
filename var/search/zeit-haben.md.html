<h2 id="variants">Variants</h2>
<ul>
<li>Hast du am Samstag Zeit? :: Are you free on Saturday?</li>
<li>Haben Sie kurz Zeit? :: Do you have a moment?</li>
<li>Ich habe leider keine Zeit. :: Sadly I'm not free.</li>
</ul>
<h2 id="usage">Usage</h2>
<p>To ask whether someone is free. No time is <em>keine Zeit</em>, not <em>nicht Zeit</em>.</p>
