<h2 id="examples">Examples</h2>
<ul>
<li>Es wird vielleicht ein bisschen laut. :: It might get a bit loud.</li>
<li>Ich mache die Musik sofort leiser. :: I will turn the music down right away.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>The opposite is <em>leise</em>, quiet: <em>leiser machen</em>, to turn down.</p>
