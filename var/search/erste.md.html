<h2 id="examples">Examples</h2>
<ul>
<li>Meine Tochter geht in die erste Klasse. :: My daughter is in first grade.</li>
<li>Am ersten Tag war sie sehr müde. :: On the first day she was very tired.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>Ordinals: <em>erste, zweite, dritte, vierte</em>, then <em>-te</em> up to 19 and <em>-ste</em> from 20: <em>zwanzigste</em>.</p>
