<h2 id="examples">Examples</h2>
<ul>
<li>Zuerst die Hausaufgaben, dann darfst du spielen. :: Homework first, then you may play.</li>
<li>Hast du heute Hausaufgaben? :: Do you have homework today?</li>
</ul>
<h2 id="notes">Notes</h2>
<p>Mostly used in the plural: <em>Hausaufgaben machen</em>, to do homework.</p>
