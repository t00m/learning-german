<h2 id="examples">Examples</h2>
<ul>
<li>Wir sprechen über den Ausflug. :: We will talk about the trip.</li>
<li>Das Bild hängt über dem Sofa. :: The picture hangs above the sofa.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>über</em> plus Akkusativ also means <em>about</em>: <em>über den Ausflug sprechen</em>.</p>
