<h2 id="examples">Examples</h2>
<ul>
<li>Ich komme heute nicht. :: I'm not coming today.</li>
<li>Das ist nicht schlimm. :: That's not bad.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>nicht</em> negates verbs, adjectives and nouns with <em>der, die, das</em>. A noun with <em>ein</em> or no article takes <em>kein</em>.</p>
