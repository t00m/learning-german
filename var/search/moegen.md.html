<h2 id="examples">Examples</h2>
<ul>
<li>Mein Sohn mag Pizza. :: My son likes pizza.</li>
<li>Möchtest du auch einen Kaffee? :: Would you like a coffee too?</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>möchte</em> (ich möchte, du möchtest, er möchte) is the polite <em>would like</em> and is used every day.</p>
