<h2 id="examples">Examples</h2>
<ul>
<li>Wie lange bleibt sie zu Hause? :: How long will she stay at home?</li>
<li>Das Spiel war heute sehr lang. :: The match was very long today.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>lange</em> (with <em>e</em>) is the adverb of time: <em>Wohnen Sie schon lange hier?</em></p>
