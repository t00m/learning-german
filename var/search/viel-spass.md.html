<h2 id="variants">Variants</h2>
<ul>
<li>Viel Spaß beim Feiern! :: Have fun celebrating!</li>
<li>Viel Erfolg! :: Good luck! (with a task)</li>
<li>Viel Glück! :: Good luck!</li>
</ul>
<h2 id="usage">Usage</h2>
<p><em>beim</em> plus a verb as a noun says what to have fun with: <em>beim Spiel</em>, <em>beim Grillen</em>.</p>
