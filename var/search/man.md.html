<h2 id="examples">Examples</h2>
<ul>
<li>In der Halle trägt man Hallenschuhe. :: In the hall you wear indoor shoes.</li>
<li>Wie sagt man das auf Deutsch? :: How do you say that in German?</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>man</em> takes the <em>er</em> form of the verb. It is used much more than English <em>one</em>.</p>
