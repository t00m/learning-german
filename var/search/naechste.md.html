<h2 id="examples">Examples</h2>
<ul>
<li>Nächste Woche habe ich Urlaub. :: Next week I am on holiday.</li>
<li>Wir steigen an der nächsten Haltestelle aus. :: We get off at the next stop.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>It takes adjective endings: <em>nächste Woche</em>, <em>nächsten Montag</em>, <em>das nächste Mal</em>.</p>
