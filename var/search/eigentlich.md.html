<h2 id="examples">Examples</h2>
<ul>
<li>Was machst du eigentlich am Wochenende? :: So what are you doing at the weekend?</li>
<li>Eigentlich habe ich keine Zeit, aber ich komme. :: Actually I have no time, but I'll come.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>In a question it makes it softer and more personal.</p>
