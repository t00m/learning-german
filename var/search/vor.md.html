<h2 id="examples">Examples</h2>
<ul>
<li>Bitte seid 45 Minuten vor dem Spiel in der Halle. :: Please be in the hall 45 minutes before the match.</li>
<li>Ich warte vor der Halle auf dich. :: I'm waiting for you in front of the hall.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>With time it always takes the Dativ: <em>vor dem Spiel</em>, <em>vor zwei Jahren</em> (two years ago).</p>
