<h2 id="examples">Examples</h2>
<ul>
<li>Ich brauche heute einen Termin. :: I need an appointment today.</li>
<li>Mein Sohn hat morgen einen Termin beim Kinderarzt. :: My son has an appointment at the paediatrician's tomorrow.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>False friend: <em>Termin</em> is not a <em>term</em>; it is an appointment with a fixed time.</p>
