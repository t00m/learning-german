<h2 id="examples">Examples</h2>
<ul>
<li>Am Sonntag grillen wir mit Freunden im Garten. :: On Sunday we are having a barbecue with friends in the garden.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>mein Freund</em> often means <em>my boyfriend</em>. For a friend people say <em>ein Freund von mir</em>.</p>
