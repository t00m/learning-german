<h2 id="examples">Examples</h2>
<ul>
<li>Morgen arbeite ich nicht im Büro, sondern von zu Hause. :: Tomorrow I'm not working in the office but from home.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>After a negation, <em>sondern</em> gives the right alternative. Otherwise <em>but</em> is <em>aber</em>.</p>
