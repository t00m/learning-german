<h2 id="examples">Examples</h2>
<ul>
<li>Wo ist die Brotdose? Ich finde sie nicht. :: Where is the lunch box? I can't find it.</li>
<li>Es regnet. Es ist schon spät. :: It's raining. It's already late.</li>
</ul>
<h2 id="notes">Notes</h2>
<p><em>es</em> is for <em>das</em> words. For <em>der</em> and <em>die</em> words, <em>it</em> is <em>er</em> and <em>sie</em>. <em>es</em> also starts sentences about weather and time.</p>
