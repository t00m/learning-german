<h2 id="examples">Examples</h2>
<ul>
<li>Ja, gern! :: Yes, gladly!</li>
<li>Mein Sohn spielt lieber Fußball als Handball. :: My son prefers playing football to handball.</li>
</ul>
<h2 id="notes">Notes</h2>
<p>Verb + <em>gern</em> says what you like doing: <em>Ich spiele gern Fußball</em>, I like playing football.</p>
