name: update-course-force-compilation

on:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  KB4IT_REF: "0.12.0"
  THEME_REPO: t00m/kb4it-theme-deutschkurs
  THEME_STAMP: var/deutschkurs-theme.version   # theme version of the last build

jobs:
  # Find the latest deutschkurs release and compare it with the one of the last build
  theme:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      changed: ${{ steps.latest.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: var

      - name: Find latest deutschkurs release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$THEME_REPO" --json tagName --jq .tagName)
          version="${tag#v}"
          built=$(cat "$THEME_STAMP" 2>/dev/null || echo none)
          echo "Latest release: $version. Last build: $built."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$built" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: theme
    runs-on: ubuntu-latest

    # Both workflows commit to main, so builds run one at a time
    concurrency:
      group: build-site
      cancel-in-progress: false

    env:
      THEME_VERSION: ${{ needs.theme.outputs.version }}
      THEME_CHANGED: ${{ needs.theme.outputs.changed }}

    steps:
      # Check out the latest main, including commits pushed by an earlier build
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Install uv
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # Install KB4IT
      - name: Install KB4IT ${{ env.KB4IT_REF }}
        run: uv tool install "git+https://github.com/t00m/KB4IT@${{ env.KB4IT_REF }}" --force

      # Test KB4IT (display version)
      - name: Display current KB4IT version
        run: kb4it -v

      # KB4IT stops the build if the theme does not support this KB4IT version
      - name: Install deutschkurs theme ${{ env.THEME_VERSION }}
        run: |
          kb4it install-theme "https://github.com/${THEME_REPO}/releases/download/v${THEME_VERSION}/deutschkurs-${THEME_VERSION}.zip"
          kb4it themes

      # Update course
      - name: Update course
        run: kb4it -L DEBUG build config/deutschkurs_force_mode.json

      - name: Record theme version
        run: echo "$THEME_VERSION" > "$THEME_STAMP"

      # Commit changes
      - name: Commit and push changes (if any)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage all changes in docs/ and var/
          git add docs/
          git add var/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update docs/ after KB4IT build (deutschkurs $THEME_VERSION) [$(date -u)]"
            git push
          fi
